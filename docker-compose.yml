version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: laravel-app
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=yoviepramudya
      - DB_USERNAME=yoviepramudya_people
      - DB_PASSWORD=dagelan123

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: yoviepramudya
      POSTGRES_USER: yoviepramudya_people
      POSTGRES_PASSWORD: dagelan123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata:
